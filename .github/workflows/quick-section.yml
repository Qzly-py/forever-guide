name: Quick section download

on:
  workflow_dispatch:
    inputs:
      sections:
        description: "Comma-separated Blizzard sections, e.g. hunterpets"
        default: "hunterpets"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the chosen sections
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          SECTIONS: ${{ github.event.inputs.sections }}
          FULL_REFRESH: "1"
        run: |
          python scripts/update_blizzard.py
          python scripts/update_questie.py
      - uses: actions/upload-artifact@v4
        with:
          name: live-sections
          path: live/
