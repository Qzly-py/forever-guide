<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forever Field Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Theme: an adventurer's field guide in the spirit of the game's interface: dark stone and leather,
   gold-trimmed frames, parchment for the open entry, and the game's own item-quality and faction colours. */
:root{
  color-scheme:dark;
  --bg:#0b0907; --surface:#17120d; --sunk:#221a12; --fg:#efe3c8; --muted:#b4a27e; --line:#4a3a22;
  --gold:#f8d47a; --gold-2:#c99a3e; --gold-3:#7a5a22;
  --accent:#e3b448; --accent-ink:#1d1206; --sky:#7cc4ff;
  --red-1:#9c1c12; --red-2:#5c0d07;
  --parch:#efe2bf; --parch-2:#dcc69a; --ink:#2b1c0c; --ink-muted:#6b5232; --ink-line:#bfa271;
  --q-poor:#9d9d9d; --q-common:#ffffff; --q-uncommon:#1eff00; --q-rare:#0070dd; --q-epic:#a335ee; --q-legendary:#ff8000; --q-artifact:#e6cc80;
  --ally:#5a8cff; --horde:#ff4b3a; --both:#b4a27e;
  --f-display:"Cinzel","Trajan Pro","Palatino Linotype",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
  --frame:0 0 0 1px #000, inset 0 0 0 1px rgba(255,214,130,.07), 0 2px 8px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--sky)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto}

/* Masthead */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.mast{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:12px 8px}
.brand{font:400 22px/1.1 var(--f-display);letter-spacing:.02em;margin:0}
.brand small{display:block;font:500 11px/1.4 var(--f-data);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.upd{font:500 11px/1.3 var(--f-data);color:var(--muted);text-align:right;white-space:nowrap}
.searchrow{padding-block:0 10px}
#q{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk)}
nav{display:flex;gap:6px;overflow-x:auto;padding-block:0 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;color:var(--muted);font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

main{padding-block:18px 48px}
h2{font:400 28px/1.15 var(--f-display);margin:0 0 4px;text-wrap:balance}
h3{font:400 19px/1.25 var(--f-display);margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 16px;max-width:65ch}
.eyebrow{font:500 11px/1.3 var(--f-data);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:100%}
.toggle{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px;cursor:pointer}
.count{font:500 12px/1 var(--f-data);color:var(--muted);align-self:center;margin-left:auto}

/* Entries */
.list{display:flex;flex-direction:column;gap:8px}
details.entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.entry>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
details.entry>summary::-webkit-details-marker{display:none}
details.entry[open]>summary{border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.row1 h3{min-width:0;overflow-wrap:anywhere}
.lv{font:500 12px/1 var(--f-data);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font:500 11px/1 var(--f-data);letter-spacing:.03em;padding:4px 7px;border-radius:5px;background:var(--sunk);color:var(--muted)}
.tag.new{background:var(--accent);color:var(--accent-ink)}
.tag.Alliance{color:var(--ally)} .tag.Horde{color:var(--horde)}
.tag.carry{font-style:italic}
.body{padding:12px 14px 14px;display:grid;gap:10px}
.body p{margin:0;max-width:65ch}
dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 14px}
dt{font:500 11px/1.6 var(--f-data);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
dd{margin:0;min-width:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips span{font-size:13px;padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
.src{font-size:13px}
.ico{width:22px;height:22px;border-radius:4px;vertical-align:-4px;margin-right:8px;border:1px solid var(--line)}
.q-Common{color:var(--q-common)} .q-Uncommon{color:var(--q-uncommon)} .q-Rare{color:var(--q-rare)} .q-Epic{color:var(--q-epic)} .q-Legendary{color:var(--q-legendary)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* Home */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.panel h3{margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:0 0 18px}
.stat{text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font:500 22px/1.1 var(--f-data);font-variant-numeric:tabular-nums;color:var(--accent)}
.stat span{font-size:13px;color:var(--muted)}
.road{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.road li{display:grid;grid-template-columns:110px 1fr;gap:10px}
.road .when{font:500 12px/1.5 var(--f-data);color:var(--accent)}
.news-mini{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.news-mini li{display:grid;gap:2px}
.news-mini .d{font:500 11px/1.3 var(--f-data);color:var(--muted)}
.section{margin-top:22px}
ul.plain{margin:0;padding-left:18px}
ul.plain li{margin:2px 0}
footer{color:var(--muted);font-size:13px;padding-block:20px 32px;border-top:1px solid var(--line)}
@media (max-width:420px){.road li{grid-template-columns:1fr;gap:2px} dl{grid-template-columns:1fr} dt{margin-top:4px}}
.navgroup{display:none}
.pane{display:none}

/* Desktop: fixed section sidebar, wide content, list + detail panel side by side */
@media (min-width:1100px){
  :root{--side:236px}
  header .wrap{max-width:none;display:grid;grid-template-columns:var(--side) minmax(0,720px) 1fr;align-items:center;column-gap:28px;padding-block:12px}
  .mast{padding:0}
  .upd{grid-column:3;justify-self:end;grid-row:1}
  .searchrow{padding:0;grid-column:2;grid-row:1}
  #q{padding:11px 14px;font-size:15px}
  nav{position:fixed;top:var(--hh,64px);left:0;bottom:0;width:var(--side);flex-direction:column;gap:2px;overflow-y:auto;
      padding:14px 12px 24px;border-right:1px solid var(--line);background:var(--surface);scrollbar-width:thin}
  nav a{border:0;border-radius:8px;padding:7px 12px;font-size:14.5px;background:transparent}
  nav a:hover{background:var(--sunk);color:var(--fg)}
  nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
  .navgroup{display:block;font:500 10.5px/1 var(--f-data);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:16px 12px 6px}
  .navgroup:first-child{padding-top:4px}
  main.wrap,footer.wrap{max-width:none;margin-left:var(--side);padding-left:32px;padding-right:32px}
  main{padding-block:24px 56px}
  h2{font-size:32px}
  .lede{max-width:80ch}
  .split{display:grid;grid-template-columns:minmax(360px,5fr) minmax(420px,7fr);gap:24px;align-items:start}
  .split .list{gap:6px}
  .split details.entry>summary{padding:10px 14px}
  .split details.entry .body{display:none}
  .split details.entry>summary:hover{background:var(--sunk)}
  .split details.entry.sel{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
  .pane{display:block;position:sticky;top:calc(var(--hh,64px) + 16px);max-height:calc(100vh - var(--hh,64px) - 32px);overflow-y:auto;
        background:var(--surface);border:1px solid var(--line);border-radius:var(--r);scrollbar-width:thin}
  .pane-head{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .pane-head h3{font-size:24px}
  .pane .body{padding:18px 22px 22px;gap:14px}
  .pane .body p{max-width:75ch}
  .pane dl{grid-template-columns:150px 1fr;gap:10px 18px}
  .pane .empty{margin:16px;border:0}
  .stats{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .grid2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
}
@media (min-width:1600px){ .split{grid-template-columns:minmax(420px,1fr) minmax(560px,1.3fr)} }

@media (prefers-reduced-motion:no-preference){details.entry[open] .body{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(-3px)}to{opacity:1;transform:none}}}

/* ===== WoW-inspired skin ===== */
body{font-size:17px;background:
  radial-gradient(1200px 600px at 70% -10%, rgba(120,80,30,.18), transparent 60%),
  radial-gradient(900px 700px at -10% 110%, rgba(60,30,10,.35), transparent 60%),
  repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 6px),
  var(--bg)}
a{color:var(--sky)} a:hover{color:#b4ddff}
h2,h3,.brand,.navgroup,.pane-head h3{font-family:var(--f-display);letter-spacing:.02em}
h2{color:var(--gold);font-weight:700;text-shadow:0 2px 0 #000,0 0 18px rgba(227,180,72,.18)}
h2::after{content:"";display:block;height:2px;margin-top:8px;max-width:420px;background:linear-gradient(90deg,var(--gold-2),rgba(201,154,62,0))}
h3{font-weight:500;color:var(--fg)}
.eyebrow,dt,.count,.lv,.upd{color:var(--muted)}
/* header: carved stone with a gold rail */
header{background:linear-gradient(#251b12,#140f0a);border-bottom:0;box-shadow:0 1px 0 var(--gold-3),0 3px 0 #000,0 4px 0 var(--gold-2),0 8px 18px rgba(0,0,0,.6)}
.brand{color:var(--gold);font-weight:700;text-shadow:0 2px 0 #000}
.brand small{color:var(--gold-2);font-family:var(--f-display);letter-spacing:.14em;font-size:10px;white-space:nowrap}
#q{background:#0d0a07;border:1px solid var(--gold-3);box-shadow:inset 0 2px 6px rgba(0,0,0,.7);color:var(--fg)}
#q::placeholder{color:#8c7a58}
#q:focus{outline:none;border-color:var(--gold);box-shadow:inset 0 2px 6px rgba(0,0,0,.7),0 0 0 2px rgba(227,180,72,.25)}
/* navigation: leather tabs; the active one is a red-and-gold game button */
nav a{background:linear-gradient(#2a2016,#1b140e);border:1px solid var(--line);color:var(--muted);font-family:var(--f-display);font-weight:500;letter-spacing:.03em}
nav a:hover{color:var(--gold)}
nav a[aria-current="page"],.btn{background:linear-gradient(#c1291b,var(--red-1) 45%,var(--red-2));color:var(--gold);
  border:1px solid #e0b347;box-shadow:inset 0 1px 0 rgba(255,220,150,.45),0 0 0 1px #000;text-shadow:0 1px 0 #000;font-weight:700}
/* framed panels */
details.entry,.panel,.stat,.empty,.filters select,.toggle{background:linear-gradient(#1d1610,#141009);border:1px solid var(--gold-3);box-shadow:var(--frame)}
details.entry>summary:hover,.stat:hover{background:linear-gradient(#2a2016,#1a130d)}
.filters select,.toggle{color:var(--fg)}
.stat b{color:var(--gold);font-family:var(--f-display);font-weight:700;text-shadow:0 2px 0 #000}
.tag{background:#0f0b07;border:1px solid #3a2c18;color:#d6c39b}
.tag.new{background:linear-gradient(#e9c35a,#b8862b);color:#201304;border-color:#f6dc8b}
.tag.Alliance{color:var(--ally);border-color:#26407a} .tag.Horde{color:var(--horde);border-color:#6e1d16}
.tag.Rare,.tag.Rare\ elite{color:#c7d2ff} .tag.Elite,.tag.Rare\ elite{border-color:var(--gold-2)}
.chips span{border-color:#3a2c18;background:#100c08}
.q-Poor{color:var(--q-poor)} .q-Common{color:var(--q-common)} .q-Uncommon{color:var(--q-uncommon)} .q-Rare{color:var(--q-rare)} .q-Epic{color:var(--q-epic)} .q-Legendary{color:var(--q-legendary)} .q-Artifact,.q-Heirloom{color:var(--q-artifact)}
/* icons: square game-style frames */
.ico{border-radius:4px;border:1px solid #000;box-shadow:0 0 0 1px var(--gold-3);background:#000}
.portrait{display:block;width:100%;max-height:340px;object-fit:contain;background:radial-gradient(circle at 50% 40%,#3b2c1a,#120d08 70%);border:1px solid var(--gold-3);border-radius:var(--r);box-shadow:var(--frame)}
.thumb{width:54px;height:54px;flex:none;border-radius:6px;object-fit:cover;object-position:50% 45%;filter:brightness(1.35) contrast(1.05);background:radial-gradient(circle,#3b2c1a,#0d0906);border:1px solid #000;box-shadow:0 0 0 1px var(--gold-3)}
.row0{display:flex;gap:12px;align-items:center}
.row0>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
footer{border-top:1px solid var(--gold-3);color:var(--muted)}
/* the open entry reads like a page in a quest log */
.parch,.pane .body{background:linear-gradient(var(--parch),var(--parch-2));color:var(--ink)}
.pane .body a,.parch a{color:#7a1d0e}
.pane .body dt,.parch dt{color:var(--ink-muted)}
.pane .body .chips span,.parch .chips span{background:rgba(255,255,255,.35);border-color:var(--ink-line);color:var(--ink)}
.pane .body .tag{background:rgba(255,255,255,.4);color:var(--ink);border-color:var(--ink-line)}
.pane .body .q-Uncommon{color:#127a00} .pane .body .q-Common{color:var(--ink)} .pane .body .q-Rare{color:#004fa3} .pane .body .q-Epic{color:#7a1fbf} .pane .body .q-Legendary{color:#b85a00}
details.entry[open] .body{background:linear-gradient(var(--parch),var(--parch-2));color:var(--ink);border-radius:0 0 var(--r) var(--r)}
details.entry[open] .body a{color:#7a1d0e} details.entry[open] .body dt{color:var(--ink-muted)}
details.entry[open] .body .chips span{background:rgba(255,255,255,.35);border-color:var(--ink-line);color:var(--ink)}
.related{display:grid;gap:10px}
.related h4{margin:4px 0 2px;font:700 13px/1.2 var(--f-display);letter-spacing:.06em;color:var(--ink-muted);text-transform:uppercase}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:14px;padding:3px 9px 3px 4px;border-radius:999px;border:1px solid var(--ink-line);background:rgba(255,255,255,.35);color:var(--ink)}
.rel a:not(:has(img)){padding-left:9px}
.rel a img{width:20px;height:20px;border-radius:50%;object-fit:cover;background:#2b1c0c}
.rel a:hover{background:rgba(255,255,255,.65)}
.permalink{font-size:13px}
/* talent calculator */
.calc{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tree{background:linear-gradient(#1d1610,#100c08);border:1px solid var(--gold-3);border-radius:var(--r);box-shadow:var(--frame);padding:12px}
.tree-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.tree-head span{font:700 20px var(--f-display);color:var(--gold)}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:62px;gap:8px;justify-items:center;align-items:center}
.tal{position:relative;width:50px;height:50px;padding:0;border-radius:6px;border:2px solid #555;background:#000;cursor:pointer;filter:grayscale(.85) brightness(.7)}
.tal img,.tal .noicon{width:100%;height:100%;border-radius:4px;display:grid;place-items:center;object-fit:cover;color:var(--gold);font:700 20px var(--f-display)}
.tal b{position:absolute;right:-8px;bottom:-8px;font:700 11px var(--f-data);background:#000;color:#9aff9a;border:1px solid #444;border-radius:4px;padding:1px 4px}
.tal:not(.locked){filter:none;border-color:#2fbf2f}
.tal.has{border-color:#2fbf2f;box-shadow:0 0 8px rgba(47,191,47,.5)}
.tal.max{border-color:var(--gold);box-shadow:0 0 10px rgba(248,212,122,.6)} .tal.max b{color:var(--gold)}
.tal.locked b{color:#888}
.tal:focus-visible{outline:2px solid #fff}
.btn{padding:4px 12px;border-radius:5px;cursor:pointer;font-size:13px}
/* item links and in-game style tooltips */
a.ilink{text-decoration:none;font-weight:500;display:inline-flex;align-items:center;gap:5px;text-shadow:0 1px 0 rgba(0,0,0,.6)}
a.ilink img{width:18px;height:18px;border-radius:3px;border:1px solid #000;box-shadow:0 0 0 1px var(--gold-3)}
a.ilink:hover{text-decoration:underline}
a.ilink.chip{font-size:13px;padding:2px 8px 2px 3px;border-radius:999px;border:1px solid #3a2c18;background:#100c08}
.parch a.ilink,.pane .body a.ilink,details.entry[open] .body a.ilink{background:#1b140d;border-color:#000;text-shadow:none}
.parch a.ilink:not(.chip),.pane .body a.ilink:not(.chip),details.entry[open] .body a.ilink:not(.chip){padding:1px 6px 1px 2px;border-radius:4px}
.wtt{position:fixed;z-index:50;display:none;max-width:340px;min-width:220px;pointer-events:none;padding:9px 11px;font:14px/1.45 var(--f-body);color:#fff;
  background:linear-gradient(rgba(8,10,28,.97),rgba(4,5,16,.97));border:1px solid #9aa0b8;border-radius:5px;box-shadow:0 0 0 1px #000,0 6px 18px rgba(0,0,0,.7)}
.wtt-name{font-size:16px;font-weight:700;margin-bottom:2px}
.wtt-ilvl{color:#ffd100}
.wtt-row{display:flex;justify-content:space-between;gap:16px}
.wtt-green{color:#1eff00} .wtt-flavor{color:#ffd100} .wtt-set{color:#ffd100;margin-top:4px} .wtt-sell{color:#fff;margin-top:4px} .wtt-src{color:#9aa0b8;font-size:12px;margin-top:4px}
.wtt .q-Common{color:#fff} .wtt .q-Poor{color:#9d9d9d}
.entrypage{display:grid;gap:16px}
.entrypage .panel.parch{border-color:var(--ink-line)}
@media (min-width:1100px){ .entrypage{grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr);align-items:start} }
/* interactive zone map */
.map{position:relative;aspect-ratio:3/2;width:100%;border:1px solid var(--gold-3);border-radius:var(--r);overflow:hidden;box-shadow:var(--frame);
  background:radial-gradient(circle at 50% 50%,rgba(239,226,191,.08),transparent 70%),
  linear-gradient(rgba(201,154,62,.12) 1px,transparent 1px) 0 0/10% 10%,linear-gradient(90deg,rgba(201,154,62,.12) 1px,transparent 1px) 0 0/10% 10%,#120d08}
.map .pin{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:1px solid #000;cursor:pointer;padding:0}
.map .pin:hover,.map .pin:focus{transform:scale(1.8);z-index:3;outline:none}
.map .lbl{position:absolute;left:8px;top:6px;font:700 13px var(--f-display);color:var(--gold);text-shadow:0 1px 0 #000;pointer-events:none}
.map .tip{position:absolute;z-index:4;pointer-events:none;background:#0b0907f2;border:1px solid var(--gold-2);color:var(--fg);font-size:13px;padding:4px 8px;border-radius:4px;white-space:nowrap;transform:translate(-50%,-130%)}
.layers{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.layers label{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 9px;border:1px solid var(--ink-line);border-radius:999px;background:rgba(255,255,255,.35);cursor:pointer}
.layers i{width:10px;height:10px;border-radius:50%;border:1px solid #000;display:inline-block}

let DATA = null;
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const lvMin = s=>{const m=String(s||"").match(/\d+/);return m?+m[0]:999};
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* per-section field setup */
const tagsFor = (it, keys)=>keys.map(k=>{
  const v=it[k]; if(!has(v)) return "";
  return `<span class="tag ${k==="faction"?esc(v):""}">${esc(v)}</span>`;}).join("")
  + (it.new?`<span class="tag new">New in Forever</span>`:"")
  + (it.confidence==="vanilla-carryover"?`<span class="tag carry">Vanilla carry-over</span>`:"")
  + (it.confidence==="datamined"?`<span class="tag carry">Datamined</span>`:"");
const dlFor = (it, pairs)=>{
  const rows = pairs.filter(([k])=>has(it[k])).map(([k,label])=>{
    const v=it[k];
    const OL=["steps","rotation","statPriority","route","strategy"], UL=["bossLoot","tips","bonuses","standings","racials","books","bestRaces","keyGear","reputation"];
    const line=x=>{ const m=k==="bossLoot"&&String(x).match(/^([^:]+):\s*(.+)$/);
      return m?`${esc(m[1])}: ${m[2].split(/,\s*/).map(n=>itemLink(n)||esc(n)).join(", ")}`:(itemLink(x)||esc(x)); };
    const list=(tag)=>`<${tag} class="plain" style="margin:0;padding-left:18px">${arr(v).map(x=>`<li>${line(x)}</li>`).join("")}</${tag}>`;
    const val = (OL.includes(k)&&Array.isArray(v))?list("ol"):(UL.includes(k)&&Array.isArray(v))?list("ul"):Array.isArray(v)?`<div class="chips">${arr(v).map(x=>itemLink(x,true)||`<span>${esc(x)}</span>`).join("")}</div>`:esc(v);
    return `<dt>${label}</dt><dd>${val}</dd>`;}).join("");
  return rows?`<dl>${rows}</dl>`:"";
};
const WH = {hunterpets:"npc", rares:"npc", services:"npc", treasures:"object", quests:"quest", achievements:"achievement", itemsets:"item-set"};
const whLink = (sec,it)=>{
  let kind=WH[sec], id=it.id;
  if(sec==="talents"&&it.spell){kind="spell";id=it.spell;}
  if(sec==="collectibles"&&it.itemId){kind="item";id=it.itemId;}
  if(sec==="recipes"&&it.madeId){kind="item";id=it.madeId;}
  return kind&&id&&it._live?` <a class="src" href="https://www.wowhead.com/forever/${kind}=${esc(id)}" target="_blank" rel="noopener">Wowhead ↗</a>`:"";
};
const srcLink = it=>has(it.sourceUrl)?`<a class="src" href="${esc(it.sourceUrl)}" target="_blank" rel="noopener">Source ↗</a>`:"";

/* "In this zone" counts, built from the other sections; each count runs a search for the zone name */
function zoneCounts(z){
  if(!DATA||!z) return "";
  const zl=z.toLowerCase(); const inZ=(it,keys)=>keys.some(k=>String(it[k]||"").toLowerCase().includes(zl));
  const parts=[["quests",["zone"],"quests"],["hunterpets",["where","zone"],"tameable beasts"],["rares",["where"],"rares"],["services",["zone"],"NPCs"]]
    .map(([sec,keys,lab])=>[(DATA[sec]||[]).filter(it=>inZ(it,keys)).length,lab]).filter(([n])=>n);
  return parts.length?`<p class="src">In this zone: ${parts.map(([n,l])=>`${n} ${l}`).join(" · ")} · <a href="#" data-zsearch="${esc(z)}">search everything in ${esc(z)}</a></p>`:"";
}
document.addEventListener("click",e=>{const a=e.target.closest("[data-zsearch]"); if(!a) return; e.preventDefault(); $("#q").value=a.dataset.zsearch; route(); window.scrollTo(0,0);});
const GORDER=["Class guide","Levelling","Class quest","How-to","Profession","Reputation","Travel","Camp object"];
const GORD=it=>{const i=GORDER.indexOf(it.kind);return i<0?99:i;};
const CFG = {
  mounts:{filters:["faction","source","type"], sort:(a,b)=>(a.name||"").localeCompare(b.name||""),
    head:it=>({title:it.name, right:it.speed, tags:tagsFor(it,["faction","source","type"])}),
    body:it=>(has(it.how)?`<p>${esc(it.how)}</p>`:"")+dlFor(it,[["where","Where"],["cost","Cost"],["speed","Speed"]])+srcLink(it)},
  pets:{filters:["faction","source"], sort:(a,b)=>(a.name||"").localeCompare(b.name||""),
    head:it=>({title:it.name, right:"", tags:tagsFor(it,["faction","source","family"])}),
    body:it=>(has(it.how)?`<p>${esc(it.how)}</p>`:"")+dlFor(it,[["where","Where"],["cost","Cost"]])+srcLink(it)},
  hunterpets:{filters:["family","zone","rank"], sort:(a,b)=>(a.family||"").localeCompare(b.family||"")||((a.name?1:0)-(b.name?1:0))||lvMin(a.levels)-lvMin(b.levels)||(a.name||"").localeCompare(b.name||""),
    head:it=>({title:it.name||`${it.family} (family)`, right:it.levels?`Lv ${it.levels}`:"", tags:tagsFor(it, it.name?["family","rank","zone"]:[])}),
    body:it=>(has(it.notes)?`<p>${esc(it.notes)}</p>`:"")+dlFor(it,[["where","Where"],["role","Role"],["diet","Diet"],["abilities","Abilities"]])+(it.name&&FAM[it.family]?`<p class="src">${esc(it.family)} family: ${esc(arr(FAM[it.family].abilities).join(", "))}${has(FAM[it.family].diet)?` · eats ${esc(FAM[it.family].diet)}`:""}</p>`:"")+srcLink(it)},
  gear:{filters:["slot","quality","source"], sort:(a,b)=>(a.name||"").localeCompare(b.name||""),
    head:it=>({title:it.name, cls:"q-"+(it.quality||""), right:it.level?`Req ${it.level}`:"", tags:tagsFor(it,["quality","slot","source"])}),
    body:it=>(has(it.how)?`<p>${esc(it.how)}</p>`:"")+dlFor(it,[["where","Where"],["classes","Used by"]])+srcLink(it)},
  recipes:{filters:["profession","source"], sort:(a,b)=>(a.profession||"").localeCompare(b.profession||"")||(parseInt(a.skill)||0)-(parseInt(b.skill)||0),

    head:it=>({title:it.name, icon:it.icon, cls:"q-"+(it.quality||""), right:it.level?`iLvl ${it.level}`:"", tags:tagsFor(it,["quality","slot","source"])+(it.api?`<span class="tag">Live Forever data</span>`:`<span class="tag carry">Original-game data</span>`)}),
    body:it=>(arr(it.stats).length?`<ul class="plain">${arr(it.stats).map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:"")+dlFor(it,[["where","Where"],["set","Part of set"],["subclass","Type"],["reqLevel","Requires level"],["durability","Durability"],["buyPrice","Costs"],["sellPrice","Sells for"]])+(it.id?`<a class="src" href="https://www.wowhead.com/forever/item=${esc(it.id)}" target="_blank" rel="noopener">Drops, sources and comments ↗</a>`:"")},
  travel:{filters:["kind","faction"], sort:(a,b)=>(a.kind||"").localeCompare(b.kind||"")||(a.name||"").localeCompare(b.name||""),
    head:it=>({title:it.name, right:"", tags:tagsFor(it,["kind","faction"])}),
    body:it=>(has(it.notes)?`<p>${esc(it.notes)}</p>`:"")+dlFor(it,[["from","From"],["to","To"]])+srcLink(it)},
  quests:{filters:["zone","kind","faction"], sort:(a,b)=>lvMin(a.levels)-lvMin(b.levels)||(a.name||"").localeCompare(b.name||""),
    head:it=>({title:it.name, right:it.levels?`Lv ${it.levels}`:"", tags:tagsFor(it,["zone","kind","faction","repeatable"])}),
    body:it=>(has(it.notes)?`<p>${esc(it.notes)}</p>`:"")+(has(it.how)&&it.how!==it.notes?`<p>${esc(it.how)}</p>`:"")+dlFor(it,[["startsAt","Starts at"],["endsAt","Turn in to"],["steps","Steps"],["reqLevel","Requires level"],["after","Complete first"],["leadsTo","Leads to"],["classes","Classes"],["races","Races"],["reward","Reward"],["rewardItems","Item rewards"],["xp","Experience"],["money","Money"],["reputation","Reputation"]])+srcLink(it)},
  collectibles:{filters:["kind","source"], sort:(a,b)=>(a.name||"").localeCompare(b.name||""),
    head:it=>({title:it.name, right:"", tags:tagsFor(it,["kind","source"])}),
    body:it=>(has(it.how)?`<p>${esc(it.how)}</p>`:"")+dlFor(it,[["display","Shows as"],["where","Where"]])+srcLink(it)},

  achievements:{filters:["kind","sub"], sort:(a,b)=>(a.kind||"").localeCompare(b.kind||"")||(a.sub||"").localeCompare(b.sub||"")||(a.name||"").localeCompare(b.name||""),

  talents:{filters:["class","spec"], sort:(a,b)=>(a.class||"").localeCompare(b.class||"")||(a.spec||"").localeCompare(b.spec||"")||(a.tier||99)-(b.tier||99)||(a.name||"").localeCompare(b.name||""),
    head:it=>({title:it.name, right:[it.tier?`Tier ${it.tier}`:"",it.ranks?`${it.ranks} rank${it.ranks>1?"s":""}`:""].filter(Boolean).join(" · "), tags:tagsFor(it,["class","spec"])}),
    body:it=>(has(it.how)?`<p>${esc(it.how)}</p>`:"")},
  itemsets:{filters:[], sort:(a,b)=>(a.name||"").localeCompare(b.name||""),
    head:it=>({title:it.name, right:arr(it.pieces).length?`${arr(it.pieces).length} pieces`:"", tags:""}),
    body:it=>dlFor(it,[["pieces","Pieces"],["bonuses","Set bonuses"]])},
  services:{filters:["kind","zone","faction"], sort:(a,b)=>(a.zone||"").localeCompare(b.zone||"")||(a.kind||"").localeCompare(b.kind||"")||(a.name||"").localeCompare(b.name||""),
    head:it=>({title:it.name, right:it.title||"", tags:tagsFor(it,["kind","zone","faction"])}),
    body:it=>dlFor(it,[["where","Where"],["title","Role"],["sells","Sells"]])+srcLink(it)},
  treasures:{filters:["kind","zone"], sort:(a,b)=>(a.zone||"").localeCompare(b.zone||"")||(a.name||"").localeCompare(b.name||""),
    head:it=>({title:it.name, right:arr(it.drops).length?`${arr(it.drops).length} possible items`:"", tags:tagsFor(it,["kind","zone"])}),
    body:it=>dlFor(it,[["where","Found in"],["spots","Example spots"],["drops","Can contain"]])},
  legacy:{filters:["kind"], sort:(a,b)=>(a.kind||"").localeCompare(b.kind||"")||(parseFloat(a.points)||0)-(parseFloat(b.points)||0),
    head:it=>({title:it.name, right:has(it.points)?`${it.points} pts`:"", tags:tagsFor(it,["kind"])}),
    body:it=>(has(it.how)?`<p>${esc(it.how)}</p>`:"")+dlFor(it,[["reward","Reward"]])+srcLink(it)},
  reputations:{filters:["faction"], sort:(a,b)=>(a.name||"").localeCompare(b.name||""),

  rares:{filters:["kind"], sort:(a,b)=>lvMin(a.levels)-lvMin(b.levels),
    head:it=>({title:it.name, right:it.levels?`Lv ${it.levels}`:"", tags:tagsFor(it,["kind"])}),
    body:it=>(has(it.notes)?`<p>${esc(it.notes)}</p>`:"")+dlFor(it,[["where","Where"],["drops","Drops"]])+srcLink(it)},

  events:{filters:[], sort:(a,b)=>(a.name||"").localeCompare(b.name||""),

    body:it=>(has(it.what)?`<p>${esc(it.what)}</p>`:"")+dlFor(it,[["where","Where"],["rewards","Rewards"]])+srcLink(it)},
  zones:{filters:["continent","faction"], sort:(a,b)=>lvMin(a.levels)-lvMin(b.levels),

  instances:{filters:["kind"], sort:(a,b)=>lvMin(a.levels)-lvMin(b.levels),

    body:it=>(has(it.notes)?`<p>${esc(it.notes)}</p>`:"")+dlFor(it,[["location","Location"],["unlock","Opens"],["bosses","Bosses"],["strategy","Boss tactics"],["notableLoot","Notable loot"],["bossLoot","Loot by boss"],["tips","Tips"]])+srcLink(it)},
  classes:{filters:["kind","faction"], sort:(a,b)=>(a.kind||"Class").localeCompare(b.kind||"Class")||(a.name||"").localeCompare(b.name||""),
    head:it=>({title:it.name, right:it.power||"", tags:tagsFor(it,["kind","faction"])+arr(it.roles).map(r=>`<span class="tag">${esc(r)}</span>`).join("")}),
    body:it=>(has(it.forevChanges)?`<p>${esc(it.forevChanges)}</p>`:"")+dlFor(it,[["specs","Talent trees"],["races","Races"],["classes","Classes"],["racials","Racial abilities"]])+srcLink(it)},
  professions:{filters:["kind"], sort:(a,b)=>(a.kind||"").localeCompare(b.kind||"")||(a.name||"").localeCompare(b.name||""),
    head:it=>({title:it.name, right:it.maxSkill?`Max ${it.maxSkill}`:"", tags:tagsFor(it,["kind"])}),
    body:it=>(has(it.changes)?`<p>${esc(it.changes)}</p>`:"")+dlFor(it,[["tiers","Skill tiers"],["trainers","Trainers"],["levelingTips","Levelling"],["notableRecipes","Notable recipes"]])+srcLink(it)},
  news:{filters:["category"], sort:(a,b)=>(b.date||"").localeCompare(a.date||""),
    head:it=>({title:it.title, right:it.date, tags:tagsFor(it,["category"])}),

};

const state = {}; // per-section filter state
const FL = new WeakMap();
const flat = it=>{let s=FL.get(it); if(s===undefined){s=Object.values(it).map(v=>Array.isArray(v)?v.join(" "):(typeof v==="object"&&v?"":String(v??""))).join(" ").toLowerCase(); FL.set(it,s);} return s;};
const PAGE = 60;
const EMPTY = {items:"The item database fills itself in from Blizzard's official data once the guide's self-updating home is set up."};
function paged(el, sec, items){
  let shown=0;
  const more=()=>{
    const next=items.slice(shown, shown+PAGE); shown+=next.length;
    el.querySelector(".more")?.remove();
    el.insertAdjacentHTML("beforeend", next.map(it=>entryHTML(sec,it)).join("") + (shown<items.length?`<button class="more toggle" type="button">Show ${Math.min(PAGE,items.length-shown)} more of ${items.length-shown}</button>`:""));
    el.querySelector(".more")?.addEventListener("click", more);
  };
  el.innerHTML=""; more();
}

/* ---------- pictures: Blizzard's creature renders and icons (live/media.json) ---------- */
let MEDIA={};
const slug=s=>String(s||"").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const keyOf=it=>String(it.id||slug(it.name||it.title||it.family));
const IDX={}; /* lazy lookups by name */
function byName(sec){ if(!IDX[sec]){ const m=new Map(); for(const it of (DATA[sec]||[])){ const k=String(it.name||it.title||"").toLowerCase(); if(k&&!m.has(k)) m.set(k,it);} IDX[sec]=m; } return IDX[sec]; }
function byId(sec){ const k=sec+"#id"; if(!IDX[k]){ const m=new Map(); for(const it of (DATA[sec]||[])) if(it.id!=null) m.set(String(it.id),it); IDX[k]=m; } return IDX[k]; }
function imgOf(sec,it){
  const M=MEDIA; if(!M||!it) return "";
  if(sec==="hunterpets") return (M.creature||{})[it.display]||"";
  if(sec==="mounts") return (M.mount||{})[it.id]||"";
  if(sec==="pets") return (M.pet||{})[it.id]||"";
  return "";
}
function iconOf(sec,it){
  const M=MEDIA||{};
  if(it.icon) return it.icon;
  if(sec==="achievements") return (M.achievement||{})[it.id]||"";
  if(sec==="talents") return (M.spell||{})[it.spell]||"";
  if(sec==="professions") return (M.profession||{})[it.id]||"";
  if(sec==="classes"&&it.kind==="Class") return (M.class||{})[it.id]||"";
  if(sec==="collectibles"&&it.itemId) return (byId("items").get(String(it.itemId))||{}).icon||"";
  if(sec==="recipes"&&it.madeId) return (byId("items").get(String(it.madeId))||{}).icon||"";
  if(sec==="itemsets"&&arr(it.pieces).length) return (byName("items").get(String(it.pieces[0]).toLowerCase())||{}).icon||"";
  return "";
}
function findEntry(sec,key){ const all=DATA[sec]||[]; return all.find(x=>keyOf(x)===key)||all.find(x=>slug(x.name||x.title)===key); }

/* ---------- item links + WoW-style tooltips ---------- */
function itemLink(name,chip){
  if(!DATA||!DATA.items||!DATA.items.length||typeof name!=="string") return "";
  const it=byName("items").get(name.replace(/^\d+x\s+/,"").trim().toLowerCase()); if(!it) return "";
  const q=it.quality||"Common";
  return `<a class="ilink q-${esc(q)}${chip?" chip":""}" href="#items/${encodeURIComponent(keyOf(it))}" data-item="${esc(keyOf(it))}">${it.icon?`<img src="${esc(it.icon)}" alt="" loading="lazy">`:""}${esc(name)}</a>`;
}
function tooltipHTML(it){
  const q=it.quality||"Common", lines=arr(it.stats);
  const green=s=>/^(Use|Equip|Chance on hit):/i.test(s), quote=s=>/^“/.test(s);
  const first=[], rest=[], drop=[], seen=new Set([String(it.slot||"").toLowerCase(),String(it.subclass||"").toLowerCase()]);
  for(const s of lines){ const l=String(s).toLowerCase(); if(seen.has(l)) continue; seen.add(l);
    if(/^requires level/i.test(s)&&it.reqLevel) continue;
    if(/^(dropped by|drop chance|sold by|contained in)/i.test(s)){ drop.push(s); continue; }
    (/^(Binds|Unique|Soulbound|Quest Item)/i.test(s)?first:rest).push(s); }
  const row=(l,r)=>(l||r)?`<div class="wtt-row"><span>${esc(l||"")}</span><span>${esc(r||"")}</span></div>`:"";
  return `<div class="wtt-name q-${esc(q)}">${esc(it.name)}</div>
    ${it.level?`<div class="wtt-ilvl">Item Level ${esc(it.level)}</div>`:""}
    ${first.map(s=>`<div>${esc(s)}</div>`).join("")}
    ${row(it.slot,it.subclass!==it.slot?it.subclass:"")}
    ${rest.map(s=>`<div class="${green(s)?"wtt-green":quote(s)?"wtt-flavor":""}">${esc(s)}</div>`).join("")}
    ${it.durability?`<div>${esc(it.durability)}</div>`:""}
    ${it.reqLevel?`<div>Requires Level ${esc(it.reqLevel)}</div>`:""}
    ${it.set?`<div class="wtt-set">Part of: ${esc(it.set)}</div>`:""}
    ${it.sellPrice?`<div class="wtt-sell">Sell Price: ${esc(it.sellPrice)}</div>`:""}
    ${drop.map(s=>`<div class="wtt-src">${esc(s)}</div>`).join("")}
    ${it.source&&!drop.length?`<div class="wtt-src">Source: ${esc(it.source)}</div>`:""}`;
}
let TT;
function showTT(el,ev){
  const key=el.dataset.item||decodeURIComponent((el.getAttribute("href")||"").split("/")[1]||"");
  const it=key&&findEntry("items",key); if(!it) return;
  TT=TT||document.body.appendChild(Object.assign(document.createElement("div"),{className:"wtt",role:"tooltip"}));
  TT.innerHTML=tooltipHTML(it); TT.style.display="block"; moveTT(ev);
}
function moveTT(ev){ if(!TT||TT.style.display!=="block") return; const pad=16, w=TT.offsetWidth, h=TT.offsetHeight;
  let x=ev.clientX+pad, y=ev.clientY+pad; if(x+w>innerWidth-8) x=ev.clientX-w-pad; if(y+h>innerHeight-8) y=Math.max(8,innerHeight-h-8);
  TT.style.left=x+"px"; TT.style.top=y+"px"; }
const hideTT=()=>{ if(TT) TT.style.display="none"; };
if(matchMedia("(hover:hover)").matches){
  document.addEventListener("mouseover",e=>{ const a=e.target.closest('[data-item],a[href^="#items/"],#main details.entry[data-sec="items"]>summary');
    if(!a) return hideTT(); if(a.tagName==="SUMMARY"){ const d=a.parentElement; return showTT({dataset:{item:d.dataset.key}},e); } showTT(a,e); });
  document.addEventListener("mousemove",moveTT);
  window.addEventListener("scroll",hideTT,{passive:true});
}

/* ---------- Related: links between sections ---------- */
const lk=(sec,it)=>{ if(!it) return ""; const p=imgOf(sec,it)||iconOf(sec,it); return `<a href="#${sec}/${encodeURIComponent(keyOf(it))}">${p?`<img src="${esc(p)}" alt="" loading="lazy">`:""}${esc(it.name||it.title||it.family)}</a>`; };
const lkName=(sec,name)=>{ const it=byName(sec).get(String(name||"").toLowerCase()); return it?lk(sec,it):""; };
const relBlock=(title,links,more)=>{ links=links.filter(Boolean); return links.length?`<div><h4>${esc(title)}${more?` · ${more}`:""}</h4><div class="rel">${links.join("")}</div></div>`:""; };
const inZone=(it,z)=>{ const zl=z.toLowerCase(); return [it.zone,it.where].some(v=>String(v||"").toLowerCase().includes(zl))||(it.pts&&Object.keys(it.pts).some(k=>k.toLowerCase()===zl)); };
const zoneOf=it=>it.zone||(it.pts&&Object.keys(it.pts)[0])||"";
function related(sec,it){
  const b=[], cap=(a,n=24)=>a.slice(0,n), same=(s,f)=>(DATA[s]||[]).filter(x=>x!==it&&f(x));
  const z=zoneOf(it);
  if(z&&sec!=="zones") b.push(relBlock("Zone",[lkName("zones",z)]));
  if(sec==="zones"){ const n=it.name;
    for(const [s,l] of [["quests","Quests here"],["hunterpets","Tameable beasts here"],["rares","Rares here"],["instances","Dungeons & raids"],["treasures","Treasures here"],["services","NPCs here"]]){
      const xs=(DATA[s]||[]).filter(x=>inZone(x,n)); if(xs.length) b.push(relBlock(l,cap(xs,40).map(x=>lk(s,x)),xs.length>40?`${xs.length} in total`:""));}
  }
  if(sec==="hunterpets"&&it.family){ b.push(relBlock(`More from the ${it.family} family`,cap(same("hunterpets",x=>x.family===it.family&&x.name)).map(x=>lk(sec,x))));
    if(z) b.push(relBlock(`Other beasts in ${z}`,cap(same("hunterpets",x=>x.name&&zoneOf(x)===z)).map(x=>lk(sec,x)))); }
  if(sec==="quests"){ b.push(relBlock("Complete first",arr(it.after).map(n=>lkName("quests",n))), relBlock("Leads to",[lkName("quests",it.leadsTo)]),
      relBlock("Item rewards",arr(it.rewardItems).map(n=>lkName("items",n)))); if(z) b.push(relBlock(`More quests in ${z}`,cap(same("quests",x=>zoneOf(x)===z),18).map(x=>lk(sec,x)))); }
  if(sec==="items"){ const n=String(it.name||"");
    b.push(relBlock("Rewarded by",cap(same("quests",x=>arr(x.rewardItems).includes(n))).map(x=>lk("quests",x))),
      relBlock("Made by",cap((DATA.recipes||[]).filter(r=>String(r.madeId)===String(it.id))).map(x=>lk("recipes",x))),
      relBlock("Part of",[lkName("itemsets",it.set)]),
      relBlock("Sold by",cap((DATA.services||[]).filter(s=>arr(s.sells).includes(n))).map(x=>lk("services",x))),
      relBlock("Found in",cap((DATA.treasures||[]).filter(t=>arr(t.drops).includes(n))).map(x=>lk("treasures",x)))); }
  if(sec==="itemsets") b.push(relBlock("Pieces",arr(it.pieces).map(n=>lkName("items",n))));
  if(sec==="recipes") b.push(relBlock("Makes",[it.madeId?lk("items",byId("items").get(String(it.madeId))):""]), relBlock(`More ${it.profession||""} recipes`,cap(same("recipes",x=>x.profession===it.profession&&x.category===it.category),18).map(x=>lk(sec,x))));
  if(sec==="rares"||sec==="treasures") b.push(relBlock("Drops",cap(arr(it.drops).map(n=>lkName("items",n)),30)), z?relBlock(`More in ${z}`,cap(same(sec,x=>zoneOf(x)===z),18).map(x=>lk(sec,x))):"");
  if(sec==="services") b.push(relBlock("Sells",cap(arr(it.sells).map(n=>lkName("items",n)),40)), z?relBlock(`Other NPCs in ${z}`,cap(same(sec,x=>x.zone===z),18).map(x=>lk(sec,x))):"");
  if(sec==="talents") b.push(relBlock(`More ${it.spec||""} talents`,cap(same(sec,x=>x.spec===it.spec&&x.class===it.class),30).map(x=>lk(sec,x))), relBlock("Guides",same("guides",x=>x.class===it.class&&x.kind==="Class guide").map(x=>lk("guides",x))));
  if(sec==="classes"&&it.kind!=="Race") b.push(relBlock("Guides",same("guides",x=>x.class===it.name).map(x=>lk("guides",x))), relBlock("Talents",cap(same("talents",x=>x.class===it.name),40).map(x=>lk("talents",x))));
  if(sec==="guides"&&it.class) b.push(relBlock(`More ${it.class} guides`,same(sec,x=>x.class===it.class).map(x=>lk(sec,x))), relBlock("Class",[lkName("classes",it.class)]));
  if(sec==="achievements") b.push(relBlock(`More in ${it.sub||it.kind||"this category"}`,cap(same(sec,x=>x.kind===it.kind&&x.sub===it.sub),24).map(x=>lk(sec,x))));
  if(sec==="instances") b.push(relBlock("Boss loot",cap(arr(it.notableLoot).map(n=>lkName("items",n)),30)));
  return b.filter(Boolean).length?`<div class="related">${b.filter(Boolean).join("")}</div>`:"";
}

/* ---------- interactive maps (coordinates on a grid; no game artwork) ---------- */
const MAPL=[["quests","Quest givers"],["hunterpets","Tameable beasts"],["rares","Rares"],["treasures","Treasures, herbs & ore"],["services","NPCs"]];
function mapHTML(zone,focus){
  const zl=zone.toLowerCase(), pins=[];
  for(const [s] of MAPL) for(const it of (DATA[s]||[])){
    const pts=it.pts&&Object.entries(it.pts).find(([k])=>k.toLowerCase()===zl); if(!pts) continue;
    const mine=focus&&it===focus; const list=mine?pts[1]:pts[1].slice(0,s==="hunterpets"?4:3);
    for(const [x,y] of list) pins.push(`<button class="pin L-${s}${mine?" me":""}" data-l="${s}" style="left:${x}%;top:${y}%${mine?";transform:scale(1.6);z-index:2;box-shadow:0 0 0 2px #fff":""}" data-href="#${s}/${encodeURIComponent(keyOf(it))}" data-tip="${esc((it.name||it.title)+" ("+x.toFixed(0)+", "+y.toFixed(0)+")")}" aria-label="${esc(it.name||it.title)}"></button>`);
  }
  if(!pins.length) return "";
  const present=new Set(pins.map(p=>p.match(/data-l="(\w+)"/)[1]));
  return `<div><h4 style="margin:4px 0 2px;font:700 13px/1.2 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:inherit;opacity:.75">Map of ${esc(zone)}</h4>
    <div class="layers">${MAPL.filter(([s])=>present.has(s)).map(([s,l])=>`<label><input type="checkbox" data-layer="${s}" checked><i class="L-${s}"></i>${esc(l)}</label>`).join("")}</div>
    <div class="map" data-map><span class="lbl">${esc(zone)}</span>${pins.join("")}</div>
    <p class="src" style="margin:4px 0 0;opacity:.8">Positions use the in-game map's coordinates (0-100). Hover a pin for its name; click to open it.</p></div>`;
}
document.addEventListener("change",e=>{ const c=e.target.closest("[data-layer]"); if(!c) return; const m=c.closest("div").parentElement.querySelector("[data-map]");
  m.querySelectorAll(`[data-l="${c.dataset.layer}"]`).forEach(p=>p.style.display=c.checked?"":"none"); });
document.addEventListener("mouseover",e=>{ const p=e.target.closest(".map .pin"); const m=e.target.closest(".map"); if(!m) return; m.querySelector(".tip")?.remove();
  if(p){ const t=document.createElement("span"); t.className="tip"; t.textContent=p.dataset.tip; t.style.left=p.style.left; t.style.top=p.style.top; m.appendChild(t);} });
document.addEventListener("click",e=>{ const p=e.target.closest(".map .pin"); if(p){ e.preventDefault(); location.hash=p.dataset.href; } });

/* ---------- talent calculator ---------- */
let TREES=null;
function renderCalc(cls,code,lvl){
  const main=$("#main");
  if(!TREES){ main.innerHTML=`<h2>Talent calculator</h2><p class="lede">Loading talent trees…</p>`;
    opt("live/talenttrees.json").then(d=>{ TREES=(d&&d.trees)||[]; if((location.hash||"").startsWith("#talentcalc")) route(); }); return; }
  const classes=[...new Set(TREES.map(t=>t.class))].sort();
  cls=classes.includes(cls)?cls:classes[0]; lvl=Math.max(10,Math.min(60,+lvl||60));
  const trees=TREES.filter(t=>t.class===cls).sort((a,b)=>Math.min(...a.nodes.map(n=>n.col))-Math.min(...b.nodes.map(n=>n.col)));
  const nodes=trees.flatMap(t=>t.nodes.slice().sort((a,b)=>a.id-b.id));
  const pts=new Map(nodes.map((n,i)=>[n.id,Math.min(+((code||"")[i]||0),n.ranks.length)]));
  const cap=lvl-9;
  const spent=t=>t.nodes.reduce((s,n)=>s+pts.get(n.id),0), total=()=>trees.reduce((s,t)=>s+spent(t),0);
  const canAdd=(t,n)=>pts.get(n.id)<n.ranks.length&&total()<cap&&spent(t)>=(n.row-1)*5;
  const canRemove=(t,n)=>{ if(!pts.get(n.id)) return false;
    pts.set(n.id,pts.get(n.id)-1); let ok=true;
    for(const m of t.nodes) if(pts.get(m.id)&&m.row>n.row){ const below=t.nodes.filter(x=>x.row<m.row).reduce((s,x)=>s+pts.get(x.id),0); if(below<(m.row-1)*5){ok=false;break;} }
    pts.set(n.id,pts.get(n.id)+1); return ok; };
  const encode=()=>nodes.map(n=>pts.get(n.id)).join("").replace(/0+$/,"");
  const icon=n=>(MEDIA.spell||{})[n.spell]||"";
  const draw=()=>{
    history.replaceState(null,"",`#talentcalc/${encodeURIComponent(cls)}/${encode()||"0"}${lvl!==60?`/${lvl}`:""}`);
    main.querySelector("#calc").innerHTML=trees.map(t=>{ const c0=Math.min(...t.nodes.map(n=>n.col));
      return `<div class="tree"><div class="tree-head"><h3>${esc(t.name)}</h3><span>${spent(t)}</span></div><div class="tgrid">${t.nodes.map(n=>{
        const p=pts.get(n.id), max=n.ranks.length, open=spent(t)>=(n.row-1)*5;
        return `<button type="button" class="tal${p?" has":""}${p===max?" max":""}${open?"":" locked"}" style="grid-row:${n.row};grid-column:${n.col-c0+1}" data-id="${n.id}" aria-label="${esc(n.name)} ${p}/${max}">${icon(n)?`<img src="${esc(icon(n))}" alt="" onerror="this.outerHTML='<span class=noicon>${esc((n.name||"?")[0]).replace(/'/g,"")}</span>'">`:`<span class="noicon">${esc((n.name||"?")[0])}</span>`}<b>${p}/${max}</b></button>`;}).join("")}</div></div>`;}).join("");
    main.querySelector("#calc-sum").innerHTML=`<b>${total()}</b> / ${cap} points · ${trees.map(t=>spent(t)).join(" / ")} <button class="btn" id="calc-reset" type="button">Reset</button> <button class="btn" id="calc-copy" type="button">Copy link</button>`;
  };
  main.innerHTML=`<h2>Talent calculator</h2>
    <p class="lede">Plan a build with Forever's real talent trees from Blizzard's data. Left-click a talent to add a point, right-click (or long-press on a phone) to remove one. Each row needs 5 more points in that tree, as in Classic. The page link updates as you go, so you can share your build.</p>
    <div class="filters"><select id="calc-class" aria-label="Class">${classes.map(c=>`<option${c===cls?" selected":""}>${esc(c)}</option>`).join("")}</select>
      <label class="toggle">Level <input id="calc-lvl" type="number" min="10" max="60" value="${lvl}" style="width:58px;background:transparent;border:0;color:inherit"></label>
      <span class="count" id="calc-sum"></span></div>
    <div id="calc" class="calc"></div><div id="calc-tip" class="wtt"></div>`;
  const tip=main.querySelector("#calc-tip"), calc=main.querySelector("#calc");
  const find=id=>{ for(const t of trees){ const n=t.nodes.find(x=>x.id===+id); if(n) return [t,n]; } return []; };
  const moveTip=ev=>{ const w=tip.offsetWidth,h=tip.offsetHeight; let x=ev.clientX+16,y=ev.clientY+16; if(x+w>innerWidth-8) x=ev.clientX-w-16; if(y+h>innerHeight-8) y=Math.max(8,innerHeight-h-8); tip.style.left=x+"px"; tip.style.top=y+"px"; };
  const showTip=(el,ev)=>{ const [t,n]=find(el.dataset.id); if(!n) return; const p=pts.get(n.id), max=n.ranks.length;
    tip.innerHTML=`<div class="wtt-name" style="color:#fff">${esc(n.name)}</div><div>Rank ${p}/${max}</div>
      ${n.cast&&n.cast!=="Passive"?`<div class="wtt-row"><span>${esc(n.cost||"")}</span><span>${esc(n.range||"")}</span></div><div class="wtt-row"><span>${esc(n.cast)}</span><span>${esc(n.cooldown||"")}</span></div>`:""}
      ${p?`<div class="wtt-flavor" style="margin-top:4px">${esc(n.ranks[p-1])}</div>`:""}
      ${p<max?`<div style="margin-top:6px">Next rank:</div><div class="wtt-flavor">${esc(n.ranks[p])}</div>`:""}
      ${spent(t)<(n.row-1)*5?`<div style="color:#ff4b3a;margin-top:6px">Requires ${(n.row-1)*5} points in ${esc(t.name)}</div>`:""}`;
    tip.style.display="block"; moveTip(ev); };
  const act=(el,add)=>{ const [t,n]=find(el.dataset.id); if(!n) return; if(add?canAdd(t,n):canRemove(t,n)){ pts.set(n.id,pts.get(n.id)+(add?1:-1)); draw(); calc.querySelector(`[data-id="${n.id}"]`)?.focus(); } };
  calc.addEventListener("click",e=>{ const b=e.target.closest(".tal"); if(b) act(b,true); });
  calc.addEventListener("contextmenu",e=>{ const b=e.target.closest(".tal"); if(b){ e.preventDefault(); act(b,false); } });
  let press, long=false; calc.addEventListener("touchstart",e=>{ const b=e.target.closest(".tal"); long=false; if(b) press=setTimeout(()=>{long=true; act(b,false);},500); },{passive:true});
  calc.addEventListener("touchend",e=>{ clearTimeout(press); if(long) e.preventDefault(); });
  calc.addEventListener("mouseover",e=>{ const b=e.target.closest(".tal"); if(b) showTip(b,e); else tip.style.display="none"; });
  calc.addEventListener("mousemove",e=>{ if(tip.style.display==="block") moveTip(e); });
  calc.addEventListener("mouseleave",()=>tip.style.display="none");
  calc.addEventListener("keydown",e=>{ const b=e.target.closest(".tal"); if(b&&(e.key==="-"||e.key==="Backspace")){ e.preventDefault(); act(b,false);} });
  main.querySelector("#calc-class").onchange=e=>{ location.hash=`#talentcalc/${encodeURIComponent(e.target.value)}`; };
  main.querySelector("#calc-lvl").onchange=e=>{ const L=Math.max(10,Math.min(60,+e.target.value||60));
    while(total()>L-9){ const n=[...nodes].reverse().find(n=>pts.get(n.id)); pts.set(n.id,pts.get(n.id)-1); } renderCalc(cls,encode(),L); };
  main.querySelector("#calc-sum").addEventListener("click",e=>{ if(e.target.id==="calc-reset"){ nodes.forEach(n=>pts.set(n.id,0)); draw(); }
    if(e.target.id==="calc-copy"){ navigator.clipboard?.writeText(location.href); e.target.textContent="Copied!"; setTimeout(()=>e.target.textContent="Copy link",1500); } });
  draw();
}

/* ---------- full page for one entry ---------- */
function renderEntry(sec,it){
  const meta=SECTIONS.find(s=>s.id===sec)||{}; const h=CFG[sec].head(it);

  const map=z?mapHTML(z,sec==="zones"?null:it):"";
  $("#main").innerHTML=`<p class="eyebrow" style="margin:0 0 6px"><a href="#${sec}">${esc(meta.label||sec)}</a> ›</p>
    <h2 class="${h.cls||""}">${icon&&!pic?`<img class="ico" src="${esc(icon)}" alt="" style="width:36px;height:36px;vertical-align:-6px">`:""}${esc(h.title)}</h2>
    ${h.tags?`<div class="tags" style="margin:10px 0 16px">${h.tags}${h.right?`<span class="tag">${esc(h.right)}</span>`:""}</div>`:""}
    <div class="entrypage">
      <div class="panel parch" style="padding:20px 22px;display:grid;gap:14px">${CFG[sec].body(it)}${whLink(sec,it)}${related(sec,it)}</div>
      <div style="display:grid;gap:14px;align-content:start">${pic?`<img class="portrait" src="${esc(pic)}" alt="${esc(h.title)}">`:""}${map?`<div class="panel parch" style="padding:14px">${map}</div>`:""}</div>
    </div>`;

}

function entryHTML(sec,it){

}

function renderList(sec){
  const meta=SECTIONS.find(s=>s.id===sec); const cfg=CFG[sec]; const all=(DATA[sec]||[]).slice().sort(cfg.sort);
  const st=state[sec]||(state[sec]={newOnly:false});
  const opts=k=>[...new Set(all.map(i=>i[k]).filter(has))].sort();
  const filt=cfg.filters.map(k=>{const o=opts(k); if(o.length<2) return "";
    const PL={class:"classes",spec:"specs",sub:"subcategories",rank:"ranks",family:"families",category:"categories",quality:"qualities",itemClass:"item types",slot:"slots",source:"sources",faction:"factions",kind:"kinds",type:"types",zone:"zones",continent:"continents",profession:"professions"};
    return `<select data-k="${k}" aria-label="Filter by ${k}"><option value="">All ${PL[k]||k+"s"}</option>${o.map(v=>`<option${st[k]===v?" selected":""}>${esc(v)}</option>`).join("")}</select>`;}).join("");
  const anyNew=all.some(i=>i.new);
  $("#main").innerHTML=`<h2>${esc(meta.title||meta.label)}</h2>${meta.lede?`<p class="lede">${esc(meta.lede)}</p>`:""}
    <div class="filters">${filt}${anyNew?`<label class="toggle"><input type="checkbox" id="newOnly"${st.newOnly?" checked":""}> New in Forever only</label>`:""}<span class="count" id="count"></span></div>
    <div class="split"><div class="list" id="list"></div>${PANE}</div>`;
  const draw=()=>{
    const q=$("#q").value.trim().toLowerCase();
    const items=all.filter(it=>cfg.filters.every(k=>!st[k]||it[k]===st[k]) && (!st.newOnly||it.new) && (!q||flat(it).includes(q)));
    $("#count").textContent=`${items.length} of ${all.length}`;
    if(items.length) paged($("#list"), sec, items);
    else $("#list").innerHTML=`<div class="empty">${all.length?"Nothing matches those filters.":(EMPTY[sec]||"No entries yet. The next refresh will add them as sources confirm them.")}</div>`;
    selectFirst();
  };
  $("#main").querySelectorAll("select").forEach(s=>s.onchange=()=>{st[s.dataset.k]=s.value;draw();});
  const n=$("#newOnly"); if(n) n.onchange=()=>{st.newOnly=n.checked;draw();};
  draw();
}

function renderSearch(q){
  const ql=q.toLowerCase(); const out=[]; let total=0;
  for(const s of SECTIONS){ if(!CFG[s.id]) continue;
    const hits=(DATA[s.id]||[]).filter(it=>flat(it).includes(ql)).sort(CFG[s.id].sort);
    if(!hits.length) continue; total+=hits.length;
    out.push([s.id,hits]);}
  $("#main").innerHTML=`<h2>Results for “${esc(q)}”</h2><p class="lede">${total} match${total===1?"":"es"} across the guide.</p>${out.length?`<div class="split"><div>${out.map(([id,h])=>`<div class="section"><div class="eyebrow">${esc(SECTIONS.find(s=>s.id===id).label)} · ${h.length}</div><div class="list" style="margin-top:8px" data-sec="${id}"></div></div>`).join("")}</div>${PANE}</div>`:`<div class="empty">No matches. Try a shorter word, like a zone or boss name.</div>`}`;
  out.forEach(([id,h])=>paged($(`.list[data-sec="${id}"]`), id, h));
  selectFirst();
}

/* Desktop: entries open in a side panel instead of expanding in place. Phones keep the expanding list. */
const DESK=matchMedia("(min-width:1100px)");
const PANE=`<aside class="pane" id="pane" aria-live="polite"><div class="empty">Pick an entry to see its details here.</div></aside>`;
function showInPane(det){
  const pane=$("#pane"); if(!pane||!det) return;
  document.querySelectorAll("details.entry.sel").forEach(d=>d.classList.remove("sel"));
  det.classList.add("sel");
  const sum=det.querySelector("summary"), body=det.querySelector(".body");
  const sec=det.dataset.sec, it=sec&&findEntry(sec,det.dataset.key);
  const pic=it?imgOf(sec,it):"", z=it?(sec==="zones"?it.name:zoneOf(it)):"";
  pane.innerHTML=`<div class="pane-head">${sum.innerHTML}</div>${pic?`<div style="padding:14px 22px 0;background:#120d08"><img class="portrait" src="${esc(pic)}" alt=""></div>`:""}${body?body.outerHTML:""}`;
  const pb=pane.querySelector(".body"); pb?.querySelector(".row0 .thumb")?.remove();
  pane.querySelector(".pane-head .thumb")?.remove();
  if(pb&&it){ const extra=(z?mapHTML(z,sec==="zones"?null:it):"")+related(sec,it); if(extra) pb.insertAdjacentHTML("beforeend",extra); }
  pane.scrollTop=0;
}
function selectFirst(){ if(DESK.matches) showInPane(document.querySelector("#main details.entry")); }
document.addEventListener("click",e=>{
  const s=e.target.closest("#main .split details.entry>summary"); if(!s||!DESK.matches) return;
  e.preventDefault(); showInPane(s.parentElement);
});
document.addEventListener("keydown",e=>{ /* arrow keys move through the list on desktop */
  if(!DESK.matches||!["ArrowDown","ArrowUp"].includes(e.key)||(e.target.matches&&e.target.matches("input,select,textarea"))) return;
  const all=[...document.querySelectorAll("#main .split details.entry")]; if(!all.length) return;
  const i=all.findIndex(d=>d.classList.contains("sel")); const n=all[Math.max(0,Math.min(all.length-1,i+(e.key==="ArrowDown"?1:-1)))];
  if(n){ e.preventDefault(); showInPane(n); n.querySelector("summary").focus({preventScroll:true}); n.scrollIntoView({block:"nearest"}); }
});
DESK.addEventListener("change",()=>route());
const headerH=()=>document.documentElement.style.setProperty("--hh",document.querySelector("header").offsetHeight+"px");
window.addEventListener("resize",headerH);

      <div class="panel"><h3>Roadmap</h3><ul class="road">${arr(S.roadmap).map(r=>`<li><span class="when">${esc(r.when)}</span><span>${esc(r.what)}</span></li>`).join("")}</ul></div>

      ${S.skyborne?`<div class="panel"><h3>The Skyborne</h3><p style="margin:0 0 8px">${esc(S.skyborne.desc)}</p>${dlFor(S.skyborne,[["factions","Factions"],["classes","Classes"],["racials","Racials"],["startingZone","Start"],["howToUnlock","Unlock"]])}</div>`:""}
    </div>`;

function renderSystems(){
  const S=DATA.systems||{};
  $("#main").innerHTML=`<h2>Systems & FAQ</h2><p class="lede">How Forever works differently from Classic and Retail.</p>
    ${arr(S.rulesets).length?`<div class="section"><div class="eyebrow">Rulesets</div><div class="list" style="margin-top:8px">${S.rulesets.map(r=>`<div class="panel"><h3>${esc(r.name)}</h3><p style="margin:6px 0 0">${esc(r.desc)}</p></div>`).join("")}</div></div>`:""}
    <div class="section"><div class="eyebrow">Systems</div><div class="list" style="margin-top:8px">${arr(S.systems).map(s=>`<details class="entry"><summary><h3>${esc(s.name)}</h3></summary><div class="body"><p>${esc(s.desc)}</p></div></details>`).join("")}</div></div>
    <div class="section"><div class="eyebrow">FAQ</div><div class="list" style="margin-top:8px">${arr(S.faq).map(f=>`<details class="entry"><summary><h3>${esc(f.q)}</h3></summary><div class="body"><p>${esc(f.a)}</p></div></details>`).join("")}</div></div>
    <div class="section panel"><h3>Useful links</h3><ul class="plain">${arr(S.links).map(l=>`<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title)}</a></li>`).join("")}</ul></div>`;
}

function route(){
  const q=$("#q").value.trim();
  let [id,key]=(location.hash||"#home").slice(1).split("/"); key=key?decodeURIComponent(key):""; if(!SECTIONS.some(s=>s.id===id)) id="home";
  document.querySelectorAll("#nav a").forEach(a=>a.setAttribute("aria-current",a.dataset.id===id&&!q?"page":"false"));
  if(DATA&&key&&CFG[id]&&!q){ const it=findEntry(id,key); if(it) return renderEntry(id,it); }
  if(DATA&&id==="talentcalc"&&!q){ const p=(location.hash||"").slice(1).split("/"); return renderCalc(decodeURIComponent(p[1]||""),p[2]||"",p[3]); }
  if(!DATA) return;
  if(q.length>=2) return renderSearch(q);
  if(id==="home") renderHome(); else if(id==="systems") renderSystems(); else renderList(id);
}

const NAVGROUPS=[["Start",["home","news","guides","systems"]],["Collect",["mounts","pets","hunterpets","collectibles","achievements","legacy"]],
  ["Gear & crafting",["gear","items","itemsets","recipes","professions"]],["World",["quests","zones","instances","rares","treasures","travel","services","reputations","events","pvp"]],
  ["Characters",["classes","talentcalc","talents"]]];
{ const used=new Set(NAVGROUPS.flatMap(g=>g[1])); const rest=SECTIONS.filter(s=>!used.has(s.id)).map(s=>s.id);
  const link=id=>{const s=SECTIONS.find(x=>x.id===id); return s?`<a href="#${s.id}" data-id="${s.id}">${esc(s.label)}</a>`:"";};
  $("#nav").innerHTML=NAVGROUPS.concat(rest.length?[["More",rest]]:[]).map(([g,ids])=>`<span class="navgroup">${esc(g)}</span>${ids.map(link).join("")}`).join(""); }
headerH();
$("#nav").addEventListener("click",e=>{ if(e.target.closest("a")){ $("#q").value=""; window.scrollTo(0,0);} });
window.addEventListener("hashchange",route);
let t; $("#q").addEventListener("input",()=>{clearTimeout(t);t=setTimeout(route,150);});

const opt = u=>fetch(u,{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null);
EMPTY.items="Loading the item database…";
function loadItems(){
  Promise.all([opt("items_base.json"), opt("items.json")]).then(([base,live])=>{
    const byId=new Map();
    for(const it of (base&&base.items)||[]) byId.set(it.id,it);
    for(const it of (live&&live.items)||[]){ /* Blizzard's live Forever data wins over original-game data */
      const old=byId.get(it.id)||{}; const m={...old};
      for(const [k,v] of Object.entries(it)) if(has(v)) m[k]=v;
      m.api=true; byId.set(it.id,m);
    }
    DATA.items=[...byId.values()];
    EMPTY.items="The item database couldn't load. Reload the page to try again.";
    for(const k in IDX) delete IDX[k];
    const [id,key]=(location.hash||"#home").slice(1).split("/");
    if($("#q").value.trim().length>=2||key||["items","home","mounts","pets","recipes","collectibles","itemsets"].includes(id)) route();
  });
}
/* Blizzard's official Forever data (live/*.json, refreshed daily, enriched with Questie's levels, zones and sources).
   Researched entries win; live data fills their gaps and adds everything they're missing. */
const FAM={};
const norm=s=>String(s||"").toLowerCase().replace(/^(recipe|pattern|plans|formula|schematic|manual|design|technique): /,"").replace(/[^a-z0-9]+/g," ").trim();
function mergeInto(sec, entries, prep){
  const list=DATA[sec]=DATA[sec]||[];
  const byName=new Map(); for(const it of list){ const k=norm(it.name||it.title); if(k&&!byName.has(k)) byName.set(k,it); }
  for(const raw of entries){ const e=prep?prep(raw):raw; if(!e||!has(e.name)||/^(DNT\b|\[PH\]|TEST\b)|\bDNT\b|Test (Creature|Prop|Reputation)\b/i.test(e.name)) continue; e._live=true;
    /* fill a researched entry once; same-named live entries (e.g. Alliance and Horde versions of a quest) stay separate */
    const old=byName.get(norm(e.name));
    if(old&&!old._live){ for(const [k,v] of Object.entries(e)) if(has(v)&&!has(old[k])) old[k]=v; old._live=true; if(e.id&&!old.id) old.id=e.id; }
    else list.push(e);
  }
}
const LIVE_FILES=["treasures","instances","hunterpets","mounts","pets","toys","titles","itemsets","achievements","reputations","classes","talents","quests","professions","recipes","rares","services"];
function loadLive(){
  Promise.all(LIVE_FILES.map(f=>opt(`live/${f}.json`)).concat([opt("live/media.json")])).then(res=>{
    const L={}; LIVE_FILES.forEach((f,i)=>L[f]=(res[i]&&res[i].entries)||[]);
    for(const f of (DATA.hunterpets||[])) if(!f.name&&f.family) FAM[f.family]=f;
    mergeInto("instances", L.instances);
    mergeInto("hunterpets", L.hunterpets);
    DATA.hunterpets=(DATA.hunterpets||[]).filter(x=>!x.hidden);
    mergeInto("mounts", L.mounts, e=>({...e, source:e.source||"In game data"}));
    mergeInto("pets", L.pets);
    mergeInto("collectibles", L.toys);
    mergeInto("collectibles", L.titles, e=>({...e, kind:"Title"}));
    DATA.itemsets=L.itemsets.map(e=>({...e,_live:true}));
    const legacyPts=e=>{const m=String(e.reward||"").match(/(\d+)\s+Legacy Point/i); return m?+m[1]:"";};
    DATA.achievements=L.achievements.map(e=>({...e,_live:true,legacyPoints:legacyPts(e)}));
    mergeInto("legacy", L.achievements.filter(e=>legacyPts(e)), e=>({name:e.name, kind:e.kind||"Achievement", points:legacyPts(e), how:e.how, reward:e.reward, id:e.id}));
    mergeInto("reputations", L.reputations);
    mergeInto("classes", L.classes);
    DATA.talents=L.talents.map(e=>({...e,_live:true}));
    mergeInto("quests", L.quests, e=>({...e, how:String(e.how||"").replace(/\{name\}|\$[nN]/g,"adventurer").replace(/\$[bB]/g," "), kind:e.kind||e.type||e.category||"", levels:e.levels||(e.level?String(e.level):"")}));
    mergeInto("professions", L.professions);
    mergeInto("recipes", L.recipes);
    mergeInto("rares", L.rares);
    mergeInto("services", L.services);
    DATA.treasures=L.treasures.map(e=>({...e,_live:true}));
    MEDIA=res[LIVE_FILES.length]||{}; for(const k in IDX) delete IDX[k];
    const [id,key]=(location.hash||"#home").slice(1).split("/");
    if($("#q").value.trim().length>=2||key||id==="home"||LIVE_FILES.includes(id)||["collectibles","legacy","achievements","talents","itemsets","services","treasures"].includes(id)) route();
  });
}
Promise.all([
  fetch("data.json",{cache:"no-store"}).then(r=>{if(!r.ok) throw new Error(r.status);return r.json();}),
  opt("feed.json")
]).then(([d,feed])=>{
  /* feed.json and items.json are written by the site's own updater; items load after first paint */
  d.items=[];
  if(feed&&Array.isArray(feed.news)){
    const seen=new Set((d.news||[]).map(n=>n.url).filter(Boolean));
    d.news=(d.news||[]).concat(feed.news.filter(n=>n.url&&!seen.has(n.url)));
    if(feed.updated&&(!d.updated||feed.updated>d.updated)) d.updated=feed.updated;
  }
  DATA=d;
  const when=d.updated?new Date(d.updated):null;
  $("#upd").innerHTML=when?`Updated<br>${when.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}`:"";
  $("#foot").innerHTML=`Fan-made guide, not affiliated with Blizzard. Refreshed automatically from official news, Blizzard's Game Data API and community databases; each entry links to its source. Creature levels and zones, quest givers and objectives, and item drop sources come from <a href="https://github.com/Questie/QuestieDB" target="_blank" rel="noopener">Questie's QuestieDB</a> (GPLv3), with thanks to the Questie team and contributors. ${d.updated?"Last refresh: "+esc(new Date(d.updated).toUTCString()):""}`;
  route();
  loadItems();
  loadLive();
}).catch(()=>{ $("#main").innerHTML=`<div class="empty">The guide's data didn't load. Reload the page; if it keeps failing, the latest refresh may still be publishing.</div>`; $("#upd").textContent=""; });
route();
})();
</script>
